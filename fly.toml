# fly.toml app configuration file generated for visual-stocker on 2025-03-22T02:25:43Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'visual-stocker'
primary_region = 'syd'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
